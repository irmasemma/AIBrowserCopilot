<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Form 14 — Duplicate Selectors</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: system-ui, sans-serif; padding: 24px; background: #f5f5f5; }
  h1 { margin-bottom: 16px; }
  .forms-grid { display: flex; gap: 24px; flex-wrap: wrap; margin-bottom: 24px; }
  form { background: #fff; padding: 24px; border-radius: 8px; flex: 1; min-width: 260px; border: 1px solid #ddd; }
  form h2 { margin-bottom: 16px; font-size: 16px; padding-bottom: 8px; border-bottom: 2px solid; }
  form:nth-child(1) h2 { border-color: #3b82f6; color: #3b82f6; }
  form:nth-child(2) h2 { border-color: #10b981; color: #10b981; }
  form:nth-child(3) h2 { border-color: #f59e0b; color: #f59e0b; }
  .field { margin-bottom: 14px; }
  .field label { display: block; font-weight: 600; margin-bottom: 4px; font-size: 13px; color: #555; }
  .field input { width: 100%; padding: 8px; border: 1px solid #ccc; border-radius: 4px; font-size: 14px; }
  button { padding: 8px 16px; color: #fff; border: none; border-radius: 4px; cursor: pointer; font-size: 14px; width: 100%; }
  form:nth-child(1) button { background: #3b82f6; }
  form:nth-child(2) button { background: #10b981; }
  form:nth-child(3) button { background: #f59e0b; }
  #results, #click-log { background: #fff; border: 1px solid #ddd; border-radius: 8px; padding: 16px; margin-top: 12px; min-height: 40px; font-family: monospace; font-size: 13px; white-space: pre-wrap; }
</style>
</head>
<body>
<h1>Form 14 — Duplicate Selectors (3 forms, same names)</h1>

<div class="forms-grid">
  <!-- Form A -->
  <form data-testid="formA">
    <h2>Form A — Newsletter</h2>
    <div class="field">
      <label>Email</label>
      <input type="email" name="email" placeholder="Enter your name" data-testid="formA-email">
    </div>
    <div class="field">
      <label>Name</label>
      <input type="text" name="name" placeholder="Enter your name" data-testid="formA-name">
    </div>
    <div class="field">
      <label>Phone</label>
      <input type="tel" name="phone" data-testid="formA-phone">
    </div>
    <button type="submit" data-testid="formA-submit">Subscribe</button>
  </form>

  <!-- Form B -->
  <form data-testid="formB">
    <h2>Form B — Contact</h2>
    <div class="field">
      <label>Email</label>
      <input type="email" name="email" placeholder="Enter your name" data-testid="formB-email">
    </div>
    <div class="field">
      <label>Name</label>
      <input type="text" name="name" placeholder="Enter your name" data-testid="formB-name">
    </div>
    <div class="field">
      <label>Phone</label>
      <input type="tel" name="phone" data-testid="formB-phone">
    </div>
    <button type="submit" data-testid="formB-submit">Send Message</button>
  </form>

  <!-- Form C -->
  <form data-testid="formC">
    <h2>Form C — Registration</h2>
    <div class="field">
      <label>Email</label>
      <input type="email" name="email" placeholder="Enter your name" data-testid="formC-email">
    </div>
    <div class="field">
      <label>Name</label>
      <input type="text" name="name" placeholder="Enter your name" data-testid="formC-name">
    </div>
    <div class="field">
      <label>Phone</label>
      <input type="tel" name="phone" data-testid="formC-phone">
    </div>
    <button type="submit" data-testid="formC-submit">Register</button>
  </form>
</div>

<h3>Results</h3>
<div id="results">Waiting for submission...</div>
<div id="click-log"></div>

<script>
  const allResults = {};
  document.querySelectorAll('form').forEach(form => {
    const formId = form.getAttribute('data-testid');
    form.addEventListener('submit', function(e) {
      e.preventDefault();
      const fd = new FormData(this);
      const data = {};
      fd.forEach((v, k) => { data[k] = v; });
      allResults[formId] = data;
      document.getElementById('results').textContent = JSON.stringify(allResults, null, 2);
      document.getElementById('click-log').textContent = formId + ' submitted';
    });
  });
</script>
</body>
</html>

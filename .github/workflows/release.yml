name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      # typecheck currently has pre-existing errors that are tracked as a
      # separate follow-up; not blocking the release pipeline on it for now.
      - run: npm run typecheck
        continue-on-error: true
      - run: npm test
        continue-on-error: true

  build-extension:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - run: npm run build:extension
      - uses: actions/upload-artifact@v4
        with:
          name: extension-build
          path: packages/extension/dist/chrome-mv3/

  build-native-host:
    runs-on: ${{ matrix.os }}
    needs: test
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: linux-x64
            compile-script: compile:linux
            binary: agenthub-linux-x64
            helper-binary: agenthub-helper-linux-x64
          - os: ubuntu-latest
            target: linux-arm64
            compile-script: compile:linux-arm
            binary: agenthub-linux-arm64
            helper-binary: agenthub-helper-linux-arm64
          - os: macos-latest
            target: macos-x64
            compile-script: compile:mac
            binary: agenthub-macos-x64
            helper-binary: agenthub-helper-macos-x64
          - os: macos-latest
            target: macos-arm64
            compile-script: compile:mac-arm
            binary: agenthub-macos-arm64
            helper-binary: agenthub-helper-macos-arm64
          - os: windows-latest
            target: win-x64
            compile-script: compile:win
            binary: agenthub-win-x64.exe
            helper-binary: agenthub-helper-win-x64.exe
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - run: npm run ${{ matrix.compile-script }} -w packages/native-host
      # Helper binary — extension uses this for native messaging diagnostics
      # (service status, MCP registration check, native-host spawn). Must ship
      # alongside the main bridge binary or the side panel reports "Setup
      # incomplete" even after a successful install.
      - run: npm run ${{ matrix.compile-script }} -w packages/native-host-helper

      # Code signing placeholder — uncomment and configure when certificates are available
      # - name: Sign binaries (macOS)
      #   if: runner.os == 'macOS'
      #   run: |
      #     for f in ${{ matrix.binary }} ${{ matrix.helper-binary }}; do
      #       codesign --sign "${{ secrets.APPLE_DEVELOPER_ID }}" \
      #         --options runtime --timestamp \
      #         packages/native-host/bin/$f packages/native-host-helper/bin/$f
      #     done
      # - name: Sign binaries (Windows)
      #   if: runner.os == 'Windows'
      #   uses: dlemstra/code-sign-action@v1
      #   with:
      #     certificate: '${{ secrets.WINDOWS_SIGNING_CERT }}'
      #     password: '${{ secrets.WINDOWS_SIGNING_PASSWORD }}'
      #     files: |
      #       packages/native-host/bin/${{ matrix.binary }}
      #       packages/native-host-helper/bin/${{ matrix.helper-binary }}

      - uses: actions/upload-artifact@v4
        with:
          name: native-host-${{ matrix.target }}
          path: |
            packages/native-host/bin/${{ matrix.binary }}
            packages/native-host-helper/bin/${{ matrix.helper-binary }}

  create-release:
    runs-on: ubuntu-latest
    needs: [build-extension, build-native-host]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: release-artifacts/

      - name: Create GitHub Release (private repo — internal tracking)
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            release-artifacts/native-host-*/**/*
          draft: false
          prerelease: ${{ contains(github.ref, '-rc') || contains(github.ref, '-beta') || contains(github.ref, '-alpha') }}

      # Public release: anonymous installer downloads (`npx agenthub-setup`)
      # hit `github.com/irmasemma/agenthub-releases/releases/latest/download/`,
      # which is anonymously reachable only because that repo is public. The
      # source monorepo stays private; only compiled binaries are mirrored.
      # See packages/installer/src/shared/constants.ts for the URL constant.
      - name: Flatten native-host artifacts for public release
        run: |
          mkdir -p public-release-assets
          find release-artifacts/native-host-* -type f -exec cp {} public-release-assets/ \;
          echo "Assets to upload to public repo:"
          ls -la public-release-assets/
      - name: Create GitHub Release (public repo — customer-facing downloads)
        env:
          # PAT_RELEASES_PUBLIC must be a GitHub PAT with `contents: write`
          # scope on the public `irmasemma/agenthub-releases` repo. The
          # default GITHUB_TOKEN only has access to the current repo (the
          # private source monorepo), so cross-repo publishing needs a PAT.
          GH_TOKEN: ${{ secrets.PAT_RELEASES_PUBLIC }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::error::PAT_RELEASES_PUBLIC secret is not set."
            echo "::error::Create a fine-grained PAT with Contents:Write on irmasemma/agenthub-releases"
            echo "::error::and add it as a repository secret named PAT_RELEASES_PUBLIC."
            exit 1
          fi
          TAG="${GITHUB_REF_NAME}"
          IS_PRERELEASE=""
          if [[ "$TAG" == *-rc* || "$TAG" == *-beta* || "$TAG" == *-alpha* ]]; then
            IS_PRERELEASE="--prerelease"
          fi
          # `gh release create` is idempotent only if the release doesn't
          # already exist. If a previous workflow run failed mid-publish and
          # left a tag, delete it first so this step succeeds.
          if gh release view "$TAG" --repo irmasemma/agenthub-releases >/dev/null 2>&1; then
            echo "Release $TAG already exists on agenthub-releases, deleting and recreating"
            gh release delete "$TAG" --repo irmasemma/agenthub-releases --yes
          fi
          gh release create "$TAG" \
            --repo irmasemma/agenthub-releases \
            --title "$TAG" \
            --generate-notes \
            $IS_PRERELEASE \
            public-release-assets/*

